name: Publish static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-static
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site/dashboard/cards
          cp index.html _site/
          cp dashboard/*.html dashboard/*.js _site/dashboard/
          cp dashboard/cards/*.js dashboard/cards/*.css _site/dashboard/cards/
          touch _site/.nojekyll
      - name: Check JavaScript syntax
        run: |
          find _site -name '*.js' -print0 | while IFS= read -r -d '' script; do
            node --input-type=module --check < "$script"
          done
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
